<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HENNABLOOM - Bridal Henna Artist in Quetta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #fdf8f5; color: #333; }
        
        header { 
            background-image: url('banner.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 280px; 
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 10px; color: #8B4513; font-size: 2em; }
        .section-subtitle { text-align: center; margin-bottom: 30px; color: #666; }

        .designs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; text-align: center; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card h3 { color: #8B4513; margin-bottom: 5px; font-size: 1.1em; }
        .card .price { font-size: 1.2em; font-weight: bold; color: #D2691E; margin-bottom: 10px; }
        .card p { color: #666; font-size: 0.85em; margin-bottom: 15px; height: 40px; }
        .btn { display: block; background: #8B4513; color: white; padding: 10px; border: none; border-radius: 8px; font-size: 0.95em; cursor: pointer; text-decoration: none; width: 100%; }
        .btn:hover { background: #5a2d0c; }
        .badge { background: #D2691E; color: white; font-size: 0.75em; padding: 4px 8px; border-radius: 5px; display: inline-block; margin-bottom: 8px; }

        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 50px; }
        footer a { color: #D2691E; text-decoration: none; }

        .popup { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .popup-content { background-color: #fff; margin: 10% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; position: relative; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .popup-content h2 { color: #8B4513; margin-bottom: 20px; }
        .popup-content input, .popup-content textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; }
        .popup-content button { width: 100%; background: #25D366; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }

        @media(max-width: 1024px) { .designs { grid-template-columns: repeat(3, 1fr); } }
        @media(max-width: 768px) {
            header { height: 180px; }
            .designs { grid-template-columns: repeat(2, 1fr); gap: 15px; } /* Mobile 2 column */
            .card img { height: 200px; }
            .section-title { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <header></header>

    <div class="container" id="products-container">
        <p style="text-align:center;">Loading designs...</p>
    </div>

    <footer>
        <p>Contact on WhatsApp: <a href="https://wa.me/923367672293" target="_blank">0336 7672293</a></p>
        <p>© 2026 HENNABLOOM. All Rights Reserved.</p>
    </footer>

    <div id="appointmentPopup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2>Book Your Appointment</h2>
            <p id="selectedDesign" style="margin-bottom:15px; color:#8B4513; font-weight:bold;"></p>
            <form onsubmit="sendToWhatsApp(event)">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="tel" id="number" placeholder="Your WhatsApp Number" required>
                
                <!-- AUTO DATE TIME PICKER -->
                <input type="datetime-local" id="datetime" required>
                
                <textarea id="comment" rows="2" placeholder="Any comments?" ></textarea>
                <button type="submit">Send Appointment on WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        let selectedDesign = "";
        function openPopup(design) {
            selectedDesign = design;
            document.getElementById("selectedDesign").innerText = "Selected: " + design;
            document.getElementById("appointmentPopup").style.display = "block";
        }
        function closePopup() {
            document.getElementById("appointmentPopup").style.display = "none";
        }
        function sendToWhatsApp(event) {
            event.preventDefault();
            let name = document.getElementById("name").value;
            let number = document.getElementById("number").value;
            let datetime = document.getElementById("datetime").value;
            let comment = document.getElementById("comment").value;
            let yourWhatsApp = "923367672293"; 

            let message = `New Appointment Request%0A%0A*Design:* ${selectedDesign}%0A*Name:* ${name}%0A*Number:* ${number}%0A*Date & Time:* ${datetime}%0A*Comment:* ${comment}`;
            let url = `https://wa.me/${yourWhatsApp}?text=${message}`;
            window.open(url, '_blank');
            closePopup();
        }

        // GOOGLE SHEET SE DATA LOAD KARNE KA CODE
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiIcfrUozndhYYfjE-78fFldpHlO4ldstCbq74nDbrWs-nfL-aKhvo-Ndsouh9FAodqXXc_bTid6-m/pub?output=csv";

        async function loadProducts() {
            try {
                let res = await fetch(SHEET_URL);
                let data = await res.text();
                let rows = data.split("\n").slice(1); // pehli line header hai
                
                let normalHTML = `<h2 class="section-title">Our Signature Collection</h2><p class="section-subtitle">Beautiful designs for every occasion</p><div class="designs">`;
                let demandingHTML = `<h2 class="section-title" style="margin-top: 60px;">Most Demanding Designs</h2><p class="section-subtitle">Our clients' absolute favorites</p><div class="designs">`;
                let hasNormal = false, hasDemanding = false;

                rows.forEach(row => {
                    let cols = row.split(",");
                    if(cols.length < 5) return;
                    let name = cols[0].trim();
                    let price = cols[1].trim();
                    let img = cols[2].trim();
                    let desc = cols[3].trim();
                    let category = cols[4].trim();
                    if(!name) return;

                    let card = `
                    <div class="card">
                        <img src="${img}" alt="${name}">
                        <div class="card-content">
                            ${category === "Most Demanding" ? '<span class="badge">MOST DEMANDING</span>' : ''}
                            <h3>${name}</h3>
                            <p class="price">Rs: ${price}</p>
                            <p>${desc}</p>
                            <button class="btn" onclick="openPopup('${name}')">Book Now</button>
                        </div>
                    </div>`;

                    if(category === "Most Demanding") {
                        demandingHTML += card; 
                        hasDemanding = true;
                    } else {
                        normalHTML += card; 
                        hasNormal = true;
                    }
                });

                normalHTML += "</div>";
                demandingHTML += "</div>";
                document.getElementById("products-container").innerHTML = (hasNormal ? normalHTML : "") + (hasDemanding ? demandingHTML : "");

            } catch(e) {
                document.getElementById("products-container").innerHTML = "<p style='text-align:center; color:red;'>Error loading designs. Check Sheet link.</p>";
                console.log(e);
            }
        }
        loadProducts();
    </script>

</body>
</html>
